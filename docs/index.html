<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BALLKNOWER | Weekend Sports Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Material+Symbols+Outlined&display=swap">
<style>
  :root {
    --turf-green-dark: #1b4d24;
    --turf-green-light: #245e2f;
    --turf-stripe: #1f5629;
    --panel-dark: rgba(18, 26, 38, 0.94);
    --border-color: #2b394e;
    --accent-blue: #2563eb;
    --accent-gold: #fbbf24;
    --channel-col-width: 150px;
    --slot-width: 190px;
    --lane-height: 72px;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; }

  /* 8-bit Turf Background */
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    background-color: var(--turf-green-dark);
    /* Pixelated 8-bit turf stripes with pixel hash pattern */
    background-image:
      linear-gradient(rgba(0,0,0,0.3) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.3) 1px, transparent 1px),
      repeating-linear-gradient(
        0deg,
        #1d5227,
        #1d5227 40px,
        #256331 40px,
        #256331 80px
      );
    background-size: 8px 8px, 8px 8px, 100% 80px;
    image-rendering: pixelated;
  }

  /* Center Brick Wall / Pillar Header */
  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.8rem 1rem 0.5rem;
    position: relative;
    z-index: 10;
    background: rgba(10, 15, 20, 0.85);
    backdrop-filter: blur(8px);
    border-bottom: 2px solid #334155;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }

  /* Brick Structure for BALLKNOWER */
  .brick-container {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  .brick-pillar {
    background:
      linear-gradient(335deg, #782b1d 23px, transparent 23px),
      linear-gradient(155deg, #9a3412 23px, transparent 23px),
      linear-gradient(335deg, #782b1d 23px, transparent 23px),
      linear-gradient(155deg, #9a3412 23px, transparent 23px);
    background-size: 58px 58px;
    background-color: #832717;
    border: 3px solid #431407;
    border-radius: 8px;
    padding: 0.5rem 1.8rem;
    box-shadow: 0 6px 0 #2b0b04, 0 8px 16px rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .brick-logo-text {
    font-family: 'Press Start 2P', monospace;
    font-size: 1.6rem;
    color: #fef08a;
    letter-spacing: 2px;
    text-shadow: 3px 3px 0 #7f1d1d, -2px -2px 0 #450a0a, 4px 4px 0 #000;
  }

  .nav-arrow-btn {
    background: #1e293b;
    border: 2px solid #475569;
    color: #f8fafc;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    transition: all 0.15s ease;
  }
  .nav-arrow-btn:hover {
    background: #334155;
    border-color: #94a3b8;
    transform: scale(1.08);
  }

  .sub-header-week {
    font-size: 0.9rem;
    font-weight: 700;
    color: #cbd5e1;
    margin-top: 0.4rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Right Tools / Header Actions */
  .header-actions {
    position: absolute;
    right: 1.5rem;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  /* Favorite Teams Dropdown Component */
  .team-picker-container {
    position: relative;
  }
  .team-picker-btn {
    background: #1e293b;
    border: 1px solid #475569;
    color: #f1f5f9;
    padding: 0.45rem 0.9rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .team-picker-btn:hover { background: #334155; }
  .badge-count {
    background: var(--accent-gold);
    color: #000;
    font-size: 0.7rem;
    font-weight: 800;
    border-radius: 10px;
    padding: 1px 6px;
  }

  .team-dropdown-menu {
    position: absolute;
    right: 0;
    top: calc(100% + 8px);
    width: 320px;
    background: #111827;
    border: 1px solid #374151;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    display: none;
    flex-direction: column;
    z-index: 50;
    overflow: hidden;
  }
  .team-dropdown-menu.open { display: flex; }
  .team-search-box {
    padding: 0.6rem;
    border-bottom: 1px solid #374151;
    background: #1f2937;
  }
  .team-search-input {
    width: 100%;
    padding: 0.4rem 0.6rem;
    border-radius: 4px;
    border: 1px solid #4b5563;
    background: #111827;
    color: #fff;
    font-size: 0.85rem;
  }
  .team-list-scroll {
    max-height: 260px;
    overflow-y: auto;
    padding: 0.4rem 0;
  }
  .team-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.35rem 0.8rem;
    font-size: 0.82rem;
    color: #e5e7eb;
    cursor: pointer;
  }
  .team-item:hover { background: #1f2937; }
  .team-item input[type="checkbox"] { cursor: pointer; }



  /* Main Workspace Layout */
  .layout-container {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
    padding: 0.8rem 1.2rem;
  }

  /* TV Guide Box with backdrop blur */
  .guide-viewport {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: auto;
    position: relative;
    background: var(--panel-dark);
    border: 2px solid var(--border-color);
    border-radius: 8px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  }

  .guide-table {
    display: flex;
    flex-direction: column;
    min-width: max-content;
  }

  /* Time Header Row (PT) */
  .time-header-row {
    display: flex;
    position: sticky;
    top: 0;
    z-index: 8;
    background: #0f172a;
    border-bottom: 2px solid #334155;
  }
  .corner-cell {
    width: var(--channel-col-width);
    min-width: var(--channel-col-width);
    padding: 0.75rem 1rem;
    font-size: 0.8rem;
    font-weight: 800;
    color: #94a3b8;
    text-transform: uppercase;
    background: #0f172a;
    position: sticky;
    left: 0;
    z-index: 9;
    border-right: 2px solid #334155;
  }
  .time-slots-header { display: flex; }
  .time-slot-cell {
    width: var(--slot-width);
    min-width: var(--slot-width);
    padding: 0.75rem 0.8rem;
    font-size: 0.85rem;
    font-weight: 700;
    color: #e2e8f0;
    border-right: 1px solid #1e293b;
    text-align: left;
  }

  /* Channel Rows */
  .channel-row {
    display: flex;
    border-bottom: 1px solid #1e293b;
    position: relative;
    /* Height dynamic according to number of overlapping lanes */
  }
  .channel-cell {
    width: var(--channel-col-width);
    min-width: var(--channel-col-width);
    background: #111827;
    border-right: 2px solid #334155;
    position: sticky;
    left: 0;
    z-index: 6;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0.5rem 1rem;
  }
  .channel-name {
    font-weight: 800;
    font-size: 0.95rem;
    color: #fff;
  }
  .channel-tag {
    font-size: 0.7rem;
    color: var(--accent-gold);
    font-weight: 600;
  }

  /* Slots / Events Track */
  .events-track {
    display: flex;
    position: relative;
    width: calc(var(--slot-width) * var(--slot-count, 16));
    background: repeating-linear-gradient(
      90deg,
      transparent,
      transparent calc(var(--slot-width) - 1px),
      rgba(255,255,255,0.03) calc(var(--slot-width) - 1px),
      rgba(255,255,255,0.03) var(--slot-width)
    );
  }

  /* Game block rendered in an allocated lane */
  .game-block {
    position: absolute;
    height: 60px;
    border-radius: 6px;
    padding: 0.45rem 0.65rem;
    background: #1e293b;
    border: 1px solid #3b4252;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: all 0.15s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }
  .game-block:hover {
    border-color: #60a5fa;
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.6);
    z-index: 5;
  }
  .game-block.favorite {
    background: linear-gradient(135deg, #1e3a8a, #172554);
    border: 1px solid #3b82f6;
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
  }

  /* UFC Event Window block in the guide */
  .game-block.ufc-window {
    background: linear-gradient(135deg, #3b0764 0%, #1e113a 100%);
    border: 2px solid #a855f7;
    box-shadow: 0 4px 14px rgba(168, 85, 247, 0.35);
    padding: 0.55rem 0.8rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-radius: 8px;
    cursor: pointer;
  }
  .game-block.ufc-window:hover {
    border-color: #c084fc;
    box-shadow: 0 6px 20px rgba(168, 85, 247, 0.55);
    transform: translateY(-2px);
  }
  .ufc-window-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ufc-badge-pill {
    background: #a855f7;
    color: #fff;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .ufc-window-title {
    font-size: 0.88rem;
    font-weight: 800;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ufc-window-sub {
    font-size: 0.72rem;
    color: #e9d5ff;
    font-weight: 600;
  }
  .ufc-window-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(168, 85, 247, 0.3);
    padding-top: 3px;
    font-size: 0.7rem;
    color: #c4b5fd;
  }
  .ufc-inspect-hint {
    color: #fde047;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 2px;
  }

  /* UFC Fight Card Inspector Sidebar */
  .ufc-sidebar {
    position: fixed;
    top: 0;
    right: 0;
    width: 460px;
    max-width: 95vw;
    height: 100vh;
    background: #110d21;
    border-left: 2px solid #a855f7;
    display: flex;
    flex-direction: column;
    z-index: 40;
    box-shadow: -8px 0 30px rgba(0,0,0,0.75);
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .ufc-sidebar.collapsed {
    transform: translateX(100%);
    display: none;
  }
  .ufc-sidebar-header {
    background: linear-gradient(135deg, #2e1065, #170b2c);
    padding: 1rem 1.25rem;
    border-bottom: 2px solid #8b5cf6;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ufc-sidebar-title {
    font-size: 1.1rem;
    font-weight: 800;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .ufc-sidebar-close {
    background: none;
    border: none;
    color: #c4b5fd;
    font-size: 1.6rem;
    cursor: pointer;
    line-height: 1;
  }
  .ufc-sidebar-close:hover { color: #fff; }
  .ufc-sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  /* Horizontal Bout Matchup Cards */
  .ufc-bout-card {
    background: linear-gradient(145deg, #1f1438, #160c2b);
    border: 1px solid #7c3aed;
    border-radius: 8px;
    padding: 0.75rem 0.85rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .ufc-bout-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.72rem;
    border-bottom: 1px solid rgba(139, 92, 246, 0.25);
    padding-bottom: 4px;
  }
  .ufc-bout-badge {
    background: rgba(168, 85, 247, 0.25);
    border: 1px solid #a855f7;
    color: #e9d5ff;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 700;
  }
  .ufc-bout-time {
    color: #fbbf24;
    font-weight: 800;
  }
  .ufc-bout-matchup-horizontal {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
  }
  .ufc-fighter-col {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .ufc-fighter-col.left { text-align: left; }
  .ufc-fighter-col.right { text-align: right; }
  .ufc-fname {
    font-size: 0.92rem;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.2;
  }
  .ufc-frec {
    font-size: 0.75rem;
    color: #c4b5fd;
    font-weight: 600;
  }
  .ufc-vs-badge {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.75rem;
    color: #fbbf24;
    text-shadow: 1px 1px 0 #78350f;
    padding: 0 6px;
    flex-shrink: 0;
  }
  .ufc-bout-division {
    text-align: center;
    font-size: 0.7rem;
    color: #a78bfa;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* CFB Hover Popover / Game Intel */
  .cfb-popover {
    position: absolute;
    display: none;
    width: 320px;
    background: #0f172a;
    border: 2px solid #3b82f6;
    border-radius: 8px;
    padding: 0.85rem;
    box-shadow: 0 10px 25px rgba(0,0,0,0.85);
    z-index: 50;
    pointer-events: none;
  }
  .cfb-popover-title {
    font-size: 0.95rem;
    font-weight: 800;
    color: #fff;
    margin-bottom: 0.3rem;
  }
  .cfb-popover-line {
    display: inline-block;
    background: #1e3a8a;
    color: #93c5fd;
    font-size: 0.75rem;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid #3b82f6;
    margin-bottom: 0.6rem;
  }
  .cfb-form-section {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    margin-top: 0.3rem;
    border-top: 1px solid #334155;
    padding-top: 0.45rem;
  }
  .cfb-team-form-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cfb-team-name-small {
    font-size: 0.78rem;
    font-weight: 700;
    color: #e2e8f0;
    max-width: 120px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cfb-form-pills {
    display: flex;
    gap: 3px;
  }
  .form-pill {
    font-size: 0.65rem;
    font-weight: 900;
    padding: 1px 4px;
    border-radius: 3px;
    line-height: 1.2;
  }
  .form-pill.w {
    background: #15803d;
    color: #86efac;
    border: 1px solid #22c55e;
  }
  .form-pill.l {
    background: #991b1b;
    color: #fca5a5;
    border: 1px solid #ef4444;
  }

  .game-block-title {
    font-size: 0.82rem;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .game-block-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.7rem;
    color: var(--text-muted);
  }
  .favorite-badge {
    background: var(--accent-gold);
    color: #000;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 1px 4px;
    border-radius: 3px;
    margin-right: 4px;
  }
  .badge-ufc {
    background: #c084fc;
    color: #000;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 1px 4px;
    border-radius: 3px;
  }

  /* Footer Controls & Legend */
  .guide-footer {
    background: rgba(10, 15, 20, 0.9);
    border-top: 1px solid var(--border-color);
    padding: 0.5rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  .legend {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .legend-item { display: flex; align-items: center; gap: 0.4rem; }
  .legend-box { width: 14px; height: 14px; border-radius: 3px; }


  .data-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 24px; background:#101c15; font-size:.8rem; }
  .data-actions { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
  #data-warning, #live-alerts { padding:8px 24px; background:#352916; color:#fde68a; font-size:.8rem; }
  #live-alerts { background:#172554; color:#bfdbfe; }
  .empty-state { padding:24px; color:#cbd5e1; }
  .unscheduled { display:flex; flex-wrap:wrap; gap:8px; padding:12px; max-width:90vw; }
  .unscheduled button { text-align:left; }
  .game-block:focus-visible, button:focus-visible, a:focus-visible { outline:3px solid #fbbf24; outline-offset:2px; }
  .game-block { font-family:inherit; text-align:left; }
  .game-block-title, .game-block-meta { width:100%; }
  .game-block.alert { border-color:#fbbf24; }
  .cfb-popover { position:fixed; width:360px; max-width:calc(100vw - 20px); }
  .cfb-team-form-row { align-items:flex-start; flex-direction:column; gap:6px; margin-bottom:10px; }
  .cfb-team-name-small { max-width:100%; }
  .cfb-form-pills { flex-wrap:wrap; }
  .form-pill { padding:4px; }
  .detail-note { color:#cbd5e1; font-size:.82rem; line-height:1.5; margin:0; }
  .source-link { color:#93c5fd; font-size:.85rem; }
  #game-sidebar { border-color:#3b82f6; background:#0f172a; }
  #game-sidebar .ufc-sidebar-header { background:#172554; border-color:#3b82f6; }
  .nav-arrow-btn:disabled, #refresh-btn:disabled { opacity:.45; cursor:wait; }
  @media(max-width:1100px) {
    .header-actions { position:static; transform:none; margin-top:12px; }
    .guide-footer { gap:12px; flex-wrap:wrap; }
    .legend { flex-wrap:wrap; gap:10px; }
  }
  @media(max-width:600px) {
    :root { --channel-col-width:105px; }
    body { height:100dvh; }
    header { padding:10px; }
    .brick-logo-text { font-size:1rem; letter-spacing:0; }
    .brick-pillar { padding:12px 10px; }
    .brick-container { gap:8px; }
    .nav-arrow-btn { width:36px; height:36px; }
    .data-toolbar { flex-direction:column; align-items:flex-start; padding:8px 12px; }
    .layout-container { padding:8px; }
    .channel-cell { padding:8px; }
    .channel-name { font-size:.8rem; overflow-wrap:anywhere; }
    .team-dropdown-menu { position:fixed; right:10px; top:150px; max-width:calc(100vw - 20px); }
    .guide-footer { padding:8px 12px; }
    .guide-footer > div:last-child { display:none !important; }
    .ufc-sidebar { max-width:100vw; }
  }
</style>
</head>
<body>
<noscript><p class="empty-state">Enable JavaScript to load schedules directly from ESPN.</p></noscript>

<header>
  <!-- BALLKNOWER in brick wall style with flanking navigation arrows -->
  <div class="brick-container">
    <button class="nav-arrow-btn" id="prev-week-btn" aria-label="Previous week" title="Previous Week">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <div class="brick-pillar">
      <span class="brick-logo-text">BALLKNOWER</span>
    </div>
    <button class="nav-arrow-btn" id="next-week-btn" aria-label="Next week" title="Next Week">
      <span class="material-symbols-outlined">arrow_forward</span>
    </button>
  </div>

  <!-- Subheader with current week date -->
  <div class="sub-header-week" id="week-label">Loading week...</div>

  <!-- Favorite team controls -->
  <div class="header-actions">
    <!-- FBS Favorite Teams Dropdown -->
    <div class="team-picker-container">
      <button class="team-picker-btn" id="team-picker-btn" aria-expanded="false" aria-controls="team-dropdown-menu">
        <span class="material-symbols-outlined" style="font-size:18px;color:var(--accent-gold);">star</span>
        Favorite Teams
        <span class="badge-count" id="fav-count">3</span>
      </button>
      <div class="team-dropdown-menu" id="team-dropdown-menu">
        <div class="team-search-box">
          <input type="text" class="team-search-input" id="team-search-input" aria-label="Search favorite teams" placeholder="Search 130+ FBS Teams...">
        </div>
        <div class="team-list-scroll" id="team-list-scroll">
          <!-- Populated with FBS teams -->
        </div>
      </div>
    </div>


  </div>
</header>

<div class="data-toolbar">
  <span id="data-status" role="status" aria-live="polite">Loading ESPN schedules…</span>
  <div class="data-actions">
    <label><input type="checkbox" id="favorites-only"> Favorites only</label>
    <button class="team-picker-btn" id="refresh-btn">Refresh</button>
    <button class="team-picker-btn" id="today-btn">This week</button>
  </div>
</div>
<div id="data-warning" role="status" hidden></div>
<div id="live-alerts" aria-live="polite" hidden></div>
<div class="layout-container">
  <!-- Interactive TV Guide Grid Viewport -->
  <div class="guide-viewport" id="guide-viewport">
    <div class="guide-table">
      <!-- Top Time Axis (PT) -->
      <div class="time-header-row">
        <div class="corner-cell">Channel (PT)</div>
        <div class="time-slots-header" id="time-slots-header">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Channel Rows Body -->
      <div id="channel-rows-container">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <section class="ufc-sidebar collapsed" id="game-sidebar" aria-label="Game details">
    <div class="ufc-sidebar-header">
      <div class="ufc-sidebar-title" id="game-sidebar-title">Game details</div>
      <button class="ufc-sidebar-close" id="game-sidebar-close" aria-label="Close game details">&times;</button>
    </div>
    <div class="ufc-sidebar-body" id="game-sidebar-body"></div>
  </section>
  <!-- UFC Fight Card Inspector Sidebar -->
  <div class="ufc-sidebar collapsed" id="ufc-sidebar">
    <div class="ufc-sidebar-header">
      <div class="ufc-sidebar-title">
        <span class="material-symbols-outlined" style="color:#c084fc;">sports_mma</span>
        <span id="ufc-sidebar-card-title">UFC Fight Card</span>
      </div>
      <button class="ufc-sidebar-close" id="ufc-sidebar-close" aria-label="Close fight card">&times;</button>
    </div>
    <div class="ufc-sidebar-body" id="ufc-sidebar-body">
      <!-- Populated dynamically with horizontal matchup cards -->
    </div>
  </div>
</div>

<!-- Floating CFB Hover Popover -->
<div class="cfb-popover" id="cfb-popover">
  <div class="cfb-popover-title" id="cfb-pop-title">Game details</div>
  <div class="cfb-popover-line" id="cfb-pop-line">Lines unavailable</div>
  <div class="cfb-form-section" id="cfb-pop-form">
    <!-- Populated by JS -->
  </div>
</div>

<div class="guide-footer">
  <div class="legend">
    <div class="legend-item">
      <div class="legend-box" style="background:#1e3a8a; border:1px solid #3b82f6;"></div>
      <span>Selected Favorite Teams</span>
    </div>
    <div class="legend-item">
      <div class="legend-box" style="background:#4c1d95; border:1px solid #a855f7;"></div>
      <span>UFC Fight Cards</span>
    </div>
    <div class="legend-item">
      <div class="legend-box" style="background:#1e293b; border:1px solid #3b4252;"></div>
      <span>Other Games & Matchups</span>
    </div>
  </div>

  <div style="font-size: 0.8rem; color: var(--text-muted); display:flex; align-items:center; gap: 0.5rem;">
    <span>Pacific time · Block lengths are estimates</span>
    <button class="nav-arrow-btn" style="width:28px;height:28px;" id="scroll-now-btn" title="Scroll to Afternoon (12:30 PM PT)">
      <span class="material-symbols-outlined" style="font-size:16px;">schedule</span>
    </button>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
